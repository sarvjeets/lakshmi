default_language_version:
  python: python3
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
# codespell
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  - id: codespell
    additional_dependencies: [tomli]  # Reads [tool.codespell] on Python < 3.11
# isort
- repo: https://github.com/asottile/seed-isort-config
  rev: v2.2.0
  hooks:
  - id: seed-isort-config
- repo: https://github.com/PyCQA/isort
  rev: 9.0.2
  hooks:
  - id: isort
# flake8
- repo: https://github.com/pycqa/flake8
  rev: 7.4.1
  hooks:
    - id: flake8
      args: # arguments to configure flake8
        - "--max-line-length=79"
        - "--max-complexity=18"
        - "--select=B,C,E,F,W,T4,B9"
        - "--ignore=W503"
        - "--per-file-ignores=lakshmi/lak.py:F811"
# unittest
- repo: local
  hooks:
  - id: unittest
    name: unittest
    entry: python -m unittest discover
    language: python
    # Must be kept in sync with [project.dependencies] in pyproject.toml.
    # `additional_dependencies: [.]` would be cleaner but doesn't work for
    # repo: local hooks — the hook env ends up with no runtime deps installed.
    additional_dependencies: [click, curl_cffi, ibonds, numpy, pyxirr, PyYAML,
                              requests, tabulate, yfinance]
    types: [python]
    pass_filenames: false
